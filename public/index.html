<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf4ff">
<title>Kotoba Transform</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/apexcharts/3.45.1/apexcharts.min.js"></script>
<style>
:root{--bg:#f3f8ff;--ink:#35507a;--mut:#7f95b5;--blue:#7fb6ff;--blue2:#4f93e6;--soft:#e4f0ff;--line:#d6e6fb;--ok:#cdf3e4;--okd:#2f8a63;--bad:#ffdbe6;--badd:#c0507a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Quicksand','Noto Sans JP',sans-serif}
body{background:radial-gradient(circle at 10% -10%,#dcecff 0,transparent 45%),radial-gradient(circle at 100% 10%,#ffe9f3 0,transparent 35%),var(--bg);min-height:100vh}
.jp{font-family:'Noto Sans JP','Quicksand',sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:30;background:rgba(243,248,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 6px 20px rgba(100,150,220,.10);padding:16px}
.btn{border:0;border-radius:16px;padding:12px 18px;font-weight:700;font-family:inherit;cursor:pointer;transition:.18s;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:active{transform:scale(.96)}
.btn-p{background:linear-gradient(135deg,#8cc0ff,#5d9cf0);color:#fff;box-shadow:0 6px 14px rgba(93,156,240,.35)}
.btn-s{background:var(--soft);color:var(--blue2)}
.chip{background:var(--soft);color:var(--blue2);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.seg{display:inline-flex;background:var(--soft);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;padding:7px 18px;border-radius:11px;font-weight:700;color:var(--mut);font-family:inherit;cursor:pointer;transition:.2s}
.seg button.on{background:#fff;color:var(--blue2);box-shadow:0 2px 8px rgba(100,150,220,.2)}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#9fd0ff,#5d9cf0);border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.tile{position:relative;aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit;color:var(--ink);cursor:pointer;transition:.2s;box-shadow:0 4px 12px rgba(100,150,220,.08)}
.tile:active{transform:scale(.94)}
.tile .n{font-size:24px;font-weight:700}.tile small{color:var(--mut);font-size:11px;font-weight:600}
.tile.done{background:linear-gradient(160deg,#e9fbf3,#d3f3e6);border-color:#b9ead6}
.tile .badge{position:absolute;top:7px;right:8px;color:var(--okd);font-size:15px}
.f{border-radius:14px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.f b{font-size:11px;letter-spacing:.04em;text-transform:uppercase;opacity:.8;min-width:78px}
.f .v{text-align:right;font-weight:700}.f small{display:block;font-size:11px;opacity:.7;font-weight:500}
.f-pasif{background:#ece6ff;color:#6a55b8}.f-transitif{background:#d8f5e9;color:#2f8a63}.f-intransitif{background:#ffe9d9;color:#b86a3a}
.f.hl{box-shadow:0 0 0 2.5px currentColor}
ruby rt{font-size:.5em;font-weight:500;color:var(--mut)}
.opt{width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:13px 16px;font-size:17px;font-family:'Noto Sans JP',sans-serif;color:var(--ink);cursor:pointer;transition:.15s;display:flex;gap:12px;align-items:center}
.opt:active{transform:scale(.97);background:var(--soft)}
.opt i{width:26px;height:26px;border-radius:9px;background:var(--soft);color:var(--blue2);font-style:normal;font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.opt small{margin-left:auto;color:var(--mut);font-size:11px}
.inp{width:100%;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:20px;font-family:'Noto Sans JP',sans-serif;color:var(--ink);outline:0;background:#fff;transition:.2s}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(127,182,255,.2)}
.page{animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* drawer */
#ov{position:fixed;inset:0;background:rgba(53,80,122,.35);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.3s;z-index:40}
#drawer{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;background:#fff;z-index:50;transform:translateX(-105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);border-radius:0 28px 28px 0;box-shadow:12px 0 40px rgba(80,130,200,.2);padding:22px 16px;display:flex;flex-direction:column;gap:6px}
body.menu #ov{opacity:1;pointer-events:auto}body.menu #drawer{transform:none}
#drawer a{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:16px;color:var(--ink);font-weight:700;text-decoration:none;transition:.2s}
#drawer a i{width:34px;height:34px;display:grid;place-items:center;background:var(--soft);color:var(--blue2);border-radius:12px}
#drawer a.on{background:var(--soft)}#drawer a.on i{background:var(--blue2);color:#fff}
/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:480px;margin:0 auto;border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .35s cubic-bezier(.2,.9,.3,1.1);box-shadow:0 -10px 40px rgba(80,130,200,.25);cursor:pointer}
.sheet.ok{background:#e9fbf3;color:#256b4d}.sheet.bad{background:#fff0f5;color:#a63e66}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .tm{height:5px;border-radius:9px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:12px}
.sheet .tm i{display:block;height:100%;background:currentColor;opacity:.5;animation:shr linear forwards}
@keyframes shr{from{width:100%}to{width:0}}
.confetti{position:fixed;left:50%;top:38%;pointer-events:none;z-index:70;animation:pop 1.1s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.floatxp{position:fixed;right:22px;top:96px;z-index:70;font-weight:700;font-size:22px;color:var(--blue2);text-shadow:0 2px 0 #fff;animation:fl 1.3s ease-out forwards;pointer-events:none}
@keyframes fl{from{opacity:0;transform:translateY(14px) scale(.8)}20%{opacity:1;transform:scale(1.15)}to{opacity:0;transform:translateY(-50px)}}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pulse{animation:pl .6s}@keyframes pl{50%{transform:scale(1.2)}}
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);padding:10px 18px;border-radius:99px;font-weight:700;z-index:80;box-shadow:0 8px 24px rgba(80,130,200,.25);animation:rise .3s}
.rowi{background:var(--soft);border-radius:16px;padding:10px 12px}
details.g>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:700;padding:10px 12px;border-radius:14px;background:#f6faff;border:1px solid var(--line)}
details.g>summary::-webkit-details-marker{display:none}details.g[open]>summary .cv{transform:rotate(90deg)}.cv{transition:.2s;margin-left:auto;color:var(--mut)}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.stat i{color:var(--blue);font-size:18px}.stat b{display:block;font-size:20px;margin-top:2px}.stat small{color:var(--mut);font-weight:600;font-size:11px}
</style>
</head>
<body>
<header class="top"><div class="wrap flex items-center justify-between h-14">
  <button class="btn btn-s !p-0 w-10 h-10" data-act="menu" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
  <div class="font-bold text-lg tracking-tight"><span class="jp">言葉</span> Kotoba <span style="color:var(--blue2)">Transform</span></div>
  <span class="chip" id="chip"><i class="fa-solid fa-star"></i> Lv 1</span>
</div></header>
<div id="ov" data-act="close"></div>
<aside id="drawer">
  <div class="flex items-center gap-3 mb-4 px-2"><div class="w-12 h-12 rounded-2xl grid place-items-center text-white text-xl" style="background:linear-gradient(135deg,#9fd0ff,#5d9cf0)"><i class="fa-solid fa-language"></i></div><div><div class="font-bold">Kotoba Transform</div><small style="color:var(--mut)">Belajar kata kerja Jepang</small></div></div>
  <a href="/" data-link="/"><i class="fa-solid fa-house"></i>Beranda</a>
  <a href="/study" data-link="/study"><i class="fa-solid fa-book-open"></i>Belajar</a>
  <a href="/quiz" data-link="/quiz"><i class="fa-solid fa-gamepad"></i>Kuis</a>
  <a href="/profile" data-link="/profile"><i class="fa-solid fa-chart-pie"></i>Profil &amp; Statistik</a>
  <div class="mt-auto text-center text-xs" style="color:var(--mut)">Progress tersimpan di localStorage 🌸</div>
</aside>
<main class="wrap py-4 pb-28" id="app"></main>

<script>
/* ============ STATE & STORAGE ============ */
const KEY='kotobaTransform.v1', FORMS=['pasif','transitif','intransitif'];
const FL={pasif:'Pasif',transitif:'Transitif',intransitif:'Intransitif'};
const INTERVALS=[0,0,1,2,4,8,16];          // hari per level Leitner (box 1..6)
const BASE={mcq:10,typing:20,guess:25};     // XP dasar per tipe soal
const TYPES={mcq:['Pilihan Ganda','fa-list-check'],typing:['Ketik / Ubah','fa-keyboard'],guess:['Tebak Arti','fa-lightbulb']};
const def=()=>({xp:0,points:0,bestCombo:0,streakDays:0,lastStudy:null,done:{},srs:{},history:[],daily:{},
  byType:{mcq:{c:0,w:0},typing:{c:0,w:0},guess:{c:0,w:0}},byForm:{pasif:{c:0,w:0},transitif:{c:0,w:0},intransitif:{c:0,w:0}},session:null,quiz:null});
let S=(()=>{try{return Object.assign(def(),JSON.parse(localStorage.getItem(KEY))||{})}catch{return def()}})();
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
let DATA=[],ERR='',Q=null,charts=[],timer=null;

/* ============ HELPERS ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rnd(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a} // Fisher-Yates + crypto
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const lvl=xp=>Math.floor(Math.sqrt(xp/50))+1, lvBase=l=>50*(l-1)**2;
const lvInfo=xp=>{const l=lvl(xp),b=lvBase(l),n=lvBase(l+1);return{l,pct:Math.round((xp-b)/(n-b)*100),cur:xp-b,need:n-b}};
const ruby=w=>w.furigana&&w.furigana!==w.kanji?`<ruby>${esc(w.kanji)}<rt>${esc(w.furigana)}</rt></ruby>`:esc(w.kanji);
const rubyF=f=>f.reading&&f.reading!==f.text?`<ruby>${esc(f.text)}<rt>${esc(f.reading)}</rt></ruby>`:esc(f.text);
const fv=f=>f?`<span class="jp">${esc(f.text)}</span>${f.reading&&f.reading!==f.text?`<small class="jp">${esc(f.reading)}</small>`:''}`:'—';
const kata2hira=s=>s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const norm=s=>kata2hira(String(s).normalize('NFKC').replace(/[\s・･·、,。.〜~]/g,'').toLowerCase());
const isKana=c=>/[\u3040-\u30ff]/.test(c);
function toast(m){const t=document.createElement('div');t.className='toast';t.innerHTML=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function countUp(el,to,d=1100,dec=0){const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=(to*e).toFixed(dec);if(p<1)requestAnimationFrame(f)})(t0)}
function burst(list=['✨','⭐','💙','🌸','🎉']){for(let i=0;i<16;i++){const s=document.createElement('span');s.className='confetti';s.textContent=list[rnd(list.length)];
  const a=Math.random()*Math.PI*2,r=90+Math.random()*130;s.style.cssText+=`--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r-40}px;--r:${rnd(360)}deg;font-size:${16+rnd(14)}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}}
function floatXP(txt){const e=document.createElement('div');e.className='floatxp';e.textContent=txt;document.body.appendChild(e);setTimeout(()=>e.remove(),1300)}
const updateChip=()=>{const i=lvInfo(S.xp);$('#chip').innerHTML=`<i class="fa-solid fa-star"></i> Lv ${i.l} · ${S.xp} XP`};

/* ============ DATA NORMALIZER (fleksibel terhadap nama field) ============ */
const pick=(o,ks)=>{for(const k of ks){const v=o[k];if(v!==undefined&&v!==null&&(typeof v==='object'||String(v).trim()!==''))return v}return ''};
const ALIAS={pasif:['pasif','passive','pasif_kanji'],transitif:['transitif','transitive','tadoushi','tadoshi'],intransitif:['intransitif','intransitive','jidoushi','jidoshi']};
function derive(text,w){ // turunkan hiragana dari stem kanji kata dasar (mis. 上げられる -> あげられる)
  if(!text||!w.kanji||!w.furigana)return '';
  if(![...text].some(c=>!isKana(c)))return text;
  let k=0;const K=w.kanji,R=w.furigana;
  while(k<K.length&&k<R.length&&K[K.length-1-k]===R[R.length-1-k]&&isKana(K[K.length-1-k]))k++;
  const sk=K.slice(0,K.length-k),sr=R.slice(0,R.length-k);
  if(sk&&text.startsWith(sk)&&![...text.slice(sk.length)].some(c=>!isKana(c)))return sr+text.slice(sk.length);
  return '';
}
function mkForm(v,o,form,w){
  let text='',reading='';
  if(v&&typeof v==='object'){text=String(pick(v,['kanji','text','word','jp'])||'');reading=String(pick(v,['furigana','reading','hiragana','kana'])||'')}
  else text=String(v||'').trim();
  if(!text||/^[-–—]$/.test(text))return null;
  const m=text.match(/^(.+?)\s*[（(](.+?)[）)]\s*$/);if(m){text=m[1].trim();reading=reading||m[2].trim()}
  reading=reading||String(pick(o,[form+'_furigana',form+'Furigana',form+'_reading',form+'_kana'])||'');
  if(!reading)reading=derive(text,w);
  if(!reading&&![...text].some(c=>!isKana(c)))reading=text;
  const alts=s=>String(s).split(/[\/／、,]/).map(norm).filter(Boolean);
  return{text,reading,acc:[...new Set([norm(text),...alts(text),...alts(reading),norm(reading)].filter(Boolean))]};
}
function normalize(raw){
  let list=[];
  if(Array.isArray(raw))list=raw;
  else if(raw&&typeof raw==='object')for(const[k,v]of Object.entries(raw)){
    const dn=parseInt((k.match(/\d+/)||[])[0]);
    const arr=Array.isArray(v)?v:(v&&Array.isArray(v.words||v.data))?(v.words||v.data):null;
    if(arr)arr.forEach(x=>list.push({...x,day:x.day||x.hari||dn||undefined}));
  }
  const out=[];
  list.forEach((o,i)=>{
    const w={kanji:String(pick(o,['kanji','word','kotoba','jisho'])||'').trim(),furigana:String(pick(o,['furigana','reading','hiragana','kana'])||'').trim(),
      meaning:String(pick(o,['meaning','arti','makna','indonesia'])||'').trim(),day:Number(pick(o,['day','hari']))||Math.floor(i/10)+1,forms:{}};
    if(!w.kanji)return;
    w.id=w.day+'|'+w.kanji;
    FORMS.forEach(f=>w.forms[f]=mkForm(pick(o,ALIAS[f]),o,f,w));
    out.push(w);
  });
  return out;
}

/* ============ ROUTER ============ */
function go(p,replace){history[replace?'replaceState':'pushState']({},'',p);render()}
window.addEventListener('popstate',render);
function render(){
  clearTimeout(timer);charts.forEach(c=>{try{c.destroy()}catch{}});charts=[];$('#sheet')?.remove();
  const p=location.pathname.replace(/\/$/,'')||'/';
  document.querySelectorAll('#drawer a').forEach(a=>a.classList.toggle('on',a.dataset.link===p));
  closeMenu();updateChip();window.scrollTo(0,0);
  if(!DATA.length&&p!=='/profile')return $('#app').innerHTML=emptyData();
  ({'/':viewHome,'/study':viewStudy,'/quiz':viewQuiz,'/profile':viewProfile}[p]||viewHome)();
}
const openMenu=()=>document.body.classList.add('menu'), closeMenu=()=>document.body.classList.remove('menu');
function emptyData(){return `<div class="card page text-center"><div class="text-4xl mb-2">🫧</div><b>Data belum terbaca</b><p class="text-sm mt-2" style="color:var(--mut)">${esc(ERR)||'global-data.json kosong'}<br>Pastikan file ada di <code>public/data/global-data.json</code> dan berisi array seperti:</p>
<pre class="text-left text-xs p-3 rounded-2xl mt-2 overflow-auto" style="background:var(--soft)">[{"day":1,"kanji":"上がる","furigana":"あがる",
 "meaning":"naik","pasif":"上がられる",
 "transitif":"上げる","intransitif":"上がる"}]</pre></div>`}

/* ============ HOME ============ */
function viewHome(){
  const days=[...new Set(DATA.map(w=>w.day))].sort((a,b)=>a-b),i=lvInfo(S.xp),nd=days.filter(d=>S.done[d]).length;
  $('#app').innerHTML=`<section class="page space-y-4">
  <div class="card" style="background:linear-gradient(135deg,#dcecff,#f4f9ff 60%,#ffeaf3)">
    <div class="flex items-center justify-between"><div><small style="color:var(--mut);font-weight:700">Halo, pelajar! 🌷</small><div class="text-xl font-bold">Level ${i.l}</div></div>
    <div class="flex gap-2"><span class="chip"><i class="fa-solid fa-fire" style="color:#ff9b6b"></i>${S.streakDays} hari</span><span class="chip"><i class="fa-solid fa-coins" style="color:#e9b949"></i>${S.points}</span></div></div>
    <div class="bar mt-3"><i style="width:0" data-w="${i.pct}%"></i></div>
    <div class="flex justify-between text-xs mt-1 font-semibold" style="color:var(--mut)"><span>${i.cur}/${i.need} XP ke level berikutnya</span><span>${nd}/${days.length} day selesai</span></div>
  </div>
  <div><div class="font-bold mb-2 px-1"><i class="fa-solid fa-calendar-days" style="color:var(--blue)"></i> Pilih Day</div>
  <div class="grid grid-cols-3 gap-3">${days.map(d=>{const c=DATA.filter(w=>w.day===d).length,dn=S.done[d];
    return `<button class="tile ${dn?'done':''}" data-act="day" data-v="${d}"><span class="n">${d}</span><small>${dn?Math.round(dn.acc*100)+'% · '+c+' kata':c+' kata'}</small>${dn?'<i class="fa-solid fa-circle-check badge"></i>':''}</button>`}).join('')}</div></div>
  <p class="text-center text-xs" style="color:var(--mut)">Day otomatis ditandai selesai setelah kuis rampung ✔️</p></section>`;
  requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w),60));
}
function pickDay(d){S.session={day:d,count:10,offset:0};save();go('/study')}

/* ============ STUDY ============ */
function viewStudy(){
  const s=S.session;if(!s){toast('Pilih day dulu ya 🌸');return go('/',true)}
  const all=DATA.filter(w=>w.day===s.day),n=s.count,items=all.slice(s.offset,s.offset+n);
  $('#app').innerHTML=`<section class="page space-y-3">
  <div class="flex items-center justify-between"><div><div class="text-xl font-bold">Day ${s.day}</div><small style="color:var(--mut);font-weight:600">${s.offset+1}–${s.offset+items.length} dari ${all.length} kotoba</small></div>
    <div class="seg"><button data-act="count" data-v="5" class="${n===5?'on':''}">5</button><button data-act="count" data-v="10" class="${n===10?'on':''}">10</button></div></div>
  ${items.map((w,k)=>`<div class="card" style="animation:rise .45s ${k*.05}s both">
    <div class="flex justify-between items-start"><div class="jp text-3xl font-bold">${ruby(w)}</div><span class="chip">${esc(w.meaning)||'-'}</span></div>
    <div class="space-y-2 mt-3">${FORMS.map(f=>`<div class="f f-${f}"><b>${FL[f]}</b><div class="v">${fv(w.forms[f])}</div></div>`).join('')}</div></div>`).join('')}
  <div class="flex gap-2 justify-between">
    <button class="btn btn-s" data-act="page" data-v="-1" ${s.offset?'':'disabled style="opacity:.4"'}><i class="fa-solid fa-chevron-left"></i> Sebelumnya</button>
    <button class="btn btn-s" data-act="page" data-v="1" ${s.offset+n<all.length?'':'disabled style="opacity:.4"'}>Berikutnya <i class="fa-solid fa-chevron-right"></i></button></div>
  </section>

function pickCands(items,count,used){

const srcOf=(w,s)=>s==='kanji'?{text:w.kanji,reading:w.furigana}:w.forms[s];

  const ok=['kanji',...FORMS].filter(s=>s!==c.f).map(s=>({s,f:srcOf(c.w,s)}))
    .filter(x=>x.f&&x.f.text&&!tgt.acc.includes(norm(x.f.text))&&!(x.f.reading&&tgt.acc.includes(norm(x.f.reading))));
  return ok.length?ok[rnd(ok.length)].f:srcOf(c.w,'kanji');
}
function mkOptions(c){

  const bad=t=>ans.acc.includes(norm(t))||norm(t)===norm(c.src.text);
  const add=o=>{if(o&&o.text&&!seen.has(o.text)&&!bad(o.text)){seen.add(o.text);opts.push(o)}};
  shuffle(['kanji',...FORMS].map(s=>srcOf(c.w,s))).forEach(o=>{if(opts.length<2)add(o)});          // 2 pengecoh: bentuk lain dari kata yang sama
  shuffle(DATA.filter(w=>w.id!==c.w.id&&w.forms[c.f]).map(w=>w.forms[c.f])).forEach(o=>{if(opts.length<4)add(o)}); // sisanya: kata lain, bentuk sejenis

    <div class="flex justify-between items-center mt-1 text-sm"><span>→ <b class="jp">${esc(x.w.forms[x.f].text)}</b></span><span class="chip">Box ${x.r.box}/6</span></div>
    <div class="flex justify-between text-xs mt-1 font-semibold" style="color:var(--mut)"><span><i class="fa-regular fa-clock"></i> ${when(x)}</span><span>✔ ${x.r.c} · ✖ ${x.r.w} · ${rate(x.r)}%</span></div></div>`;
  const G=[['now','Review sekarang','fa-bell','#c0507a',x=>x.diff===0],['besok','Review besok','fa-sun','#c4703f',x=>x.diff===1],['week','2–7 hari ke depan','fa-calendar-week','#2f8a63',x=>x.diff>=2&&x.diff<=7],['later','Lebih dari 7 hari','fa-hourglass-half','#4f93e6',x=>x.diff>7]].map(g=>({id:g[0],t:g[1],ic:g[2],col:g[3],list:rows.filter(g[4])}));
  const weak=rows.filter(x=>x.r.w>0).sort((a,b)=>(a.r.c/(a.r.c+a.r.w))-(b.r.c/(b.r.c+b.r.w))||b.r.w-a.r.w).slice(0,5);
  const fresh=Math.max(0,totalForms-rows.length);
  if(!rows.length)return `<div class="card"><b><i class="fa-solid fa-calendar-check" style="color:var(--blue)"></i> Jadwal Review SRS</b><p class="text-sm mt-2" style="color:var(--mut)">Belum ada data. Selesaikan kuis dan sistem akan menjadwalkan review otomatis untukmu 🌸</p></div>`;
  return `<div class="card space-y-3"><div><b><i class="fa-solid fa-calendar-check" style="color:var(--blue)"></i> Jadwal Review SRS</b>
    <p class="text-xs mt-1" style="color:var(--mut)">Dijadwalkan otomatis: salah → Box 1 (review segera), benar → naik box dengan jeda 1 → 2 → 4 → 8 → 16 hari. Item "Sekarang" akan diprioritaskan di kuis berikutnya.</p></div>
    <div class="grid grid-cols-4 gap-2">${G.map(g=>`<div class="stat !p-2"><i class="fa-solid ${g.ic}" style="color:${g.col}"></i><b class="!text-base">${g.list.length}</b><small>${g.t.replace('Review ','').replace(' ke depan','')}</small></div>`).join('')}</div>
    <div class="text-xs font-semibold" style="color:var(--mut)"><i class="fa-regular fa-circle"></i> ${fresh} bentuk belum pernah diuji</div>
    ${weak.length?`<div><div class="font-bold text-sm mb-2"><i class="fa-solid fa-triangle-exclamation" style="color:#e9a23b"></i> Titik lemah (paling sering salah)</div><div class="space-y-2">${weak.map(row).join('')}</div></div>`:''}
    <div class="space-y-2">${G.map((g,k)=>`<details class="g" ${g.id==='now'&&g.list.length?'open':''}><summary><i class="fa-solid ${g.ic}" style="color:${g.col}"></i>${g.t}<span class="chip">${g.list.length}</span><i class="fa-solid fa-chevron-right cv"></i></summary>
      <div class="space-y-2 mt-2">${g.list.length?g.list.slice(0,30).map(row).join('')+(g.list.length>30?`<p class="text-xs text-center" style="color:var(--mut)">+${g.list.length-30} item lainnya</p>`:''):'<p class="text-xs text-center py-2" style="color:var(--mut)">Kosong ✨</p>'}</div></details>`).join('')}</div></div>`;
}
function resetAll(){if(confirm('Hapus semua progress? Tindakan ini tidak bisa dibatalkan.')){localStorage.removeItem(KEY);S=def();save();toast('Progress direset 🧼');go('/')}}

/* ============ EVENTS & INIT ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-link]');if(!el)return;
  if(el.dataset.link){e.preventDefault();return go(el.dataset.link)}
  const v=el.dataset.v;
  ({day:()=>pickDay(+v),count:()=>setCount(+v),page:()=>page(+v),hafal,start:startQuiz,opt:()=>submit(null,+v),check:submitTyped,reset:resetAll,menu:openMenu,close:closeMenu,next})[el.dataset.act]?.();
});
(async()=>{
  try{const r=await fetch('/data/global-data.json');if(!r.ok)throw new Error('HTTP '+r.status);DATA=normalize(await r.json());if(!DATA.length)ERR='Tidak ada entri valid (butuh minimal field kanji).'}
  catch(e){ERR='Gagal memuat data: '+e.message}
  render();
})();
</script>
</body>
